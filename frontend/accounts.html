<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Comptes autorisés — Spin the Wheel</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Cpath d='M16 2a14 14 0 0 1 14 14H16z' fill='%23f59e0b'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="entete">
      <a class="entete__marque" href="/">Spin&nbsp;the&nbsp;Wheel</a>
      <nav class="entete__nav" id="nav" hidden>
        <a href="/">Mes roues</a>
        <span class="entete__compte" id="compte"></span>
        <button type="button" class="bouton bouton--discret" id="deconnexion">Se déconnecter</button>
      </nav>
    </header>

    <main class="page">
      <p class="statut" id="statut" hidden></p>

      <div class="page__titre">
        <h1>Comptes autorisés</h1>
      </div>

      <p class="texte-secondaire">
        Seules ces adresses Google peuvent ouvrir une session. Retirer une adresse
        ferme immédiatement les sessions ouvertes du compte correspondant.
      </p>

      <form class="carte formulaire-inline" id="form-ajout">
        <label class="champ champ--extensible">
          <span class="champ__libelle">Adresse e-mail</span>
          <input
            type="email"
            id="email"
            required
            maxlength="254"
            autocomplete="off"
            placeholder="prenom.nom@exemple.fr"
          />
        </label>
        <label class="champ champ--extensible">
          <span class="champ__libelle">Note (facultative)</span>
          <input type="text" id="note" maxlength="200" autocomplete="off" placeholder="Rôle, service…" />
        </label>
        <button type="submit" class="bouton bouton--principal">Autoriser</button>
      </form>

      <ul class="liste-comptes" id="liste-comptes"></ul>
    </main>

    <script type="module" src="/static/js/accounts.js"></script>
  </body>
</html>
